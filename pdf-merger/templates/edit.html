<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PDFページ編集</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .pdf-list-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px; /* Adjust gap for 7 columns */
            justify-content: flex-start; /* Align items to start */
            margin: 0 auto 30px auto; /* Center the main content */
            max-width: 1400px; /* Max width to accommodate 7 items per row */
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        .page-item {
            flex-shrink: 0;
            width: calc(100% / 7 - 15px); /* Approximately 7 columns with gap */
            background-color: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            cursor: grab;
            box-sizing: border-box;
            position: relative;
            margin-bottom: 15px; /* Space below each page item */
            display: flex; /* Use flex for internal alignment */
            flex-direction: column;
            justify-content: space-between; /* Push info to bottom */
        }
        .page-item.dragging {
            opacity: 0.5;
            border: 2px dashed #0078D4;
        }

        .thumbnail-container {
            width: 100%;
            padding-bottom: 133.33%; /* 3:4 aspect ratio (height is 4/3 of width) */
            position: relative;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            overflow: hidden;
        }

        .page-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; /* Scale down to fit, maintaining aspect ratio */
            object-position: center; /* Center the image within the container */
            display: block;
            border: none;
        }

        .no-thumbnail-placeholder {
            width: 100%;
            height: 100%;
            background-color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 0.9em;
            position: absolute;
            top: 0;
            left: 0;
        }

        .page-info {
            font-size: 0.9em;
            color: #555;
            line-height: 1.3;
            flex-grow: 1; /* Allow info section to grow and push to bottom */
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Align content to bottom */
        }
        .page-info strong {
            display: block;
            font-size: 0.95em;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .page-info .page-number-display {
            font-weight: bold;
            margin-top: 5px;
        }

        /* Style for the expand/collapse button inside a page-item */
        .page-item .expand-toggle-button {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            cursor: pointer;
            z-index: 10;
            line-height: 1;
            padding: 0;
        }
        .page-item.collapsed-pdf-slot .expand-toggle-button {
            transform: rotate(0deg); /* Right-pointing triangle when collapsed */
        }
        /* No specific collapsed style needed, default transform is 0deg */

        .action-buttons {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .save-btn {
            background-color: #4CAF50;
            color: white;
        }
        .save-btn:hover {
            background-color: #45a049;
        }
        .back-btn {
            background-color: #0078D4;
            color: white;
        }
        .back-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>PDFページ編集</h1>
    <p>すべてのPDFのページをまとめて並び替えできます</p>

    <div class="pdf-list-container" id="globalPageListContainer">
        <!-- Content will be rendered by JavaScript -->
    </div>

    <div class="action-buttons">
        <button class="save-btn" id="saveButton">変更を保存</button>
        <button class="back-btn" onclick="window.location.href='/main'">メイン画面に戻る</button>
    </div>

    <script>
        let allPdfsData = JSON.parse(`{{ all_pdfs_data | tojson | safe }}`);
        let expandedPdfIds = {}; // Stores which PDFs are expanded by their ID
        let displayedSlots = []; // This will hold the actual items to display on screen

        const globalPageListContainer = document.getElementById('globalPageListContainer');
        const saveButton = document.getElementById('saveButton');

        // Helper function to create a page item DOM element
        function createPageItemElement(type, data, pdfFileName, pageNumberText) {
            const div = document.createElement('div');
            div.className = 'page-item';
            div.setAttribute('draggable', 'true');

            let thumbnailHtml;
            let expandButtonHtml = '';

            if (type === 'collapsed') {
                div.classList.add('collapsed-pdf-slot');
                div.dataset.pdfId = data.id; // data is pdfData for collapsed
                div.dataset.pageIndex = 0; // Represents the whole PDF (first page index)

                const coverPage = data.pages[0];
                if (coverPage && coverPage.thumbnail_url) {
                    thumbnailHtml = `<img src="${coverPage.thumbnail_url}" alt="Page 1">`;
                } else {
                    thumbnailHtml = `<div class="no-thumbnail-placeholder">No Thumbnail</div>`;
                }
                expandButtonHtml = `<button class="expand-toggle-button">&#9654;</button>`; // Right-pointing triangle

            } else { // type === 'individual_page'
                div.dataset.pdfId = data.original_pdf_id; // data is pageData for individual page
                div.dataset.pageIndex = data.original_page_index;

                if (data.thumbnail_url) {
                    thumbnailHtml = `<img src="${data.thumbnail_url}" alt="Page ${data.page_number}">`;
                } else {
                    thumbnailHtml = `<div class="no-thumbnail-placeholder">No Thumbnail</div>`;
                }
                // No expand/collapse button on individual pages.
            }

            div.innerHTML = `
                <div class="thumbnail-container">
                    ${thumbnailHtml}
                </div>
                <div class="page-info">
                    <strong>${pdfFileName}</strong>
                    <span class="page-number-display">ページ ${pageNumberText}</span>
                </div>
                ${expandButtonHtml}
            `;

            return div;
        }

        // Function to render all currently displayed slots
        function renderDisplayedSlots() {
            globalPageListContainer.innerHTML = ''; // Clear existing content
            
            // Reconstruct displayedSlots based on allPdfsData and expandedPdfIds
            displayedSlots = [];
            allPdfsData.forEach(pdfData => {
                if (expandedPdfIds[pdfData.id]) {
                    // If PDF is expanded, add all its individual pages
                    pdfData.pages.forEach(page => {
                        displayedSlots.push({ type: 'individual_page', pdfId: pdfData.id, pageIndex: page.original_page_index });
                    });
                } else {
                    // If PDF is collapsed, add a single collapsed slot for it
                    displayedSlots.push({ type: 'collapsed', pdfId: pdfData.id, pageIndex: 0 });
                }
            });

            // Now, actually render the DOM based on the constructed displayedSlots
            displayedSlots.forEach(slot => {
                let element;
                let pdfData = allPdfsData.find(p => p.id === slot.pdfId);
                if (!pdfData) return; // Should not happen if data is consistent

                if (slot.type === 'collapsed') {
                    element = createPageItemElement('collapsed', pdfData, pdfData.filename, `1-${pdfData.total_pages}`);
                } else { // individual_page
                    const pageData = pdfData.pages.find(p => p.original_page_index === slot.pageIndex);
                    if (pageData) {
                        element = createPageItemElement('individual_page', pageData, pdfData.filename, pageData.page_number);
                    }
                }
                if (element) {
                    globalPageListContainer.appendChild(element);
                }
            });

            // Re-attach event listeners for dynamically created expand/collapse buttons
            document.querySelectorAll('.expand-toggle-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    const clickedPdfId = e.target.closest('.page-item').dataset.pdfId;
                    
                    if (expandedPdfIds[clickedPdfId]) {
                        delete expandedPdfIds[clickedPdfId]; // Collapse
                    } else {
                        expandedPdfIds[clickedPdfId] = true; // Expand
                    }
                    renderDisplayedSlots(); // Re-render the whole display to reflect the change
                });
            });
        }

        // Initial render
        renderDisplayedSlots();

        // Drag and Drop functionality (now operates on displayedSlots)
        let draggingItem = null;
        let currentDropTarget = null;

        globalPageListContainer.addEventListener('dragstart', (e) => {
            if (!e.target.classList.contains('page-item')) return;
            draggingItem = e.target;
            e.dataTransfer.effectAllowed = 'move';
            draggingItem.classList.add('dragging');
        });

        globalPageListContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            const target = e.target.closest('.page-item');

            if (target && target !== draggingItem) {
                if (currentDropTarget && currentDropTarget !== target) {
                    currentDropTarget.classList.remove('drag-over');
                }
                target.classList.add('drag-over');
                currentDropTarget = target;

                const parentContainer = target.parentNode;
                const targetRect = target.getBoundingClientRect();
                const dragX = e.clientX;

                const isBefore = (dragX < targetRect.left + targetRect.width / 2);

                if (isBefore) {
                    parentContainer.insertBefore(draggingItem, target);
                } else {
                    parentContainer.insertBefore(draggingItem, target.nextElementSibling);
                }
            } else if (currentDropTarget) {
                currentDropTarget.classList.remove('drag-over');
                currentDropTarget = null;
            }
        });

        globalPageListContainer.addEventListener('dragleave', (e) => {
            if (!e.relatedTarget || !e.relatedTarget.closest('.page-item')) {
                 if (currentDropTarget) {
                    currentDropTarget.classList.remove('drag-over');
                    currentDropTarget = null;
                }
            }
        });

        globalPageListContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            if (currentDropTarget) {
                currentDropTarget.classList.remove('drag-over');
                currentDropTarget = null;
            }
            draggingItem.classList.remove('dragging');
            draggingItem = null;

            // Update the displayedSlots array after drop to reflect new DOM order
            updateDisplayedSlotsOrderFromDOM();
        });

        globalPageListContainer.addEventListener('dragend', () => {
            if (draggingItem) {
                draggingItem.classList.remove('dragging');
            }
            // Ensure order is updated even if drop outside valid target
            updateDisplayedSlotsOrderFromDOM();
        });

        function updateDisplayedSlotsOrderFromDOM() {
            displayedSlots = [];
            document.querySelectorAll('#globalPageListContainer .page-item').forEach(item => {
                displayedSlots.push({
                    type: item.classList.contains('collapsed-pdf-slot') ? 'collapsed' : 'individual_page',
                    pdfId: item.dataset.pdfId,
                    pageIndex: item.classList.contains('collapsed-pdf-slot') ? 0 : parseInt(item.dataset.pageIndex) // pageIndex is 0 for collapsed slots
                });
            });
            console.log("Displayed Slots Order Updated from DOM:", displayedSlots);
        }

        saveButton.addEventListener('click', () => {
            const finalGlobalOrderForMerge = [];

            displayedSlots.forEach(slot => {
                if (slot.type === 'collapsed') {
                    // If it's a collapsed PDF, add all its original pages to the final merge order
                    const originalPdfData = allPdfsData.find(pdf => pdf.id === slot.pdfId);
                    if (originalPdfData) {
                        originalPdfData.pages.forEach(page => {
                            finalGlobalOrderForMerge.push({
                                pdf_id: page.original_pdf_id,
                                page_index: page.original_page_index
                            });
                        });
                    }
                } else { // It's an individual page
                    finalGlobalOrderForMerge.push({ pdf_id: slot.pdfId, page_index: slot.pageIndex });
                }
            });

            fetch('/update_global_page_order', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ order: finalGlobalOrderForMerge }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('ページの並び順が保存されました！');
                } else {
                    alert('ページの並び順の保存に失敗しました: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error saving global page order:', error);
                alert('ページの並び順の保存中にエラーが発生しました。');
            });
        });
    </script>
</body>
</html>
